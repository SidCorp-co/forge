name: Setup workspace
description: |
  Checkout-aware composite for forge's pnpm workspace. Handles pnpm + Node
  setup, the pre-install lockfile-transport refusal, frozen-lockfile install,
  and the prebuild of every emit-only workspace dep that consumers need (Node
  22 won't load .ts under node_modules, so dist/ must exist — and dist/ is
  gitignored — before vitest/tsc/build commands resolve it).

  Use this in every job that touches a workspace package. Do NOT add per-job
  pnpm/setup-node/install steps — drift between jobs is exactly what this
  composite exists to prevent.

inputs:
  prebuild-deps:
    description: |
      Set to "false" to skip building the emit-only workspace deps. Default
      "true" matches what every package consumer needs. Skip only for jobs
      that import none of them (e.g. docs, install-check).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    # Before the install, not after it: the lockfile entry this refuses is the one that kills
    # `pnpm install`, so a check that runs afterwards never runs at all. It lives here rather than
    # in one ci.yml job because six jobs reach the install through this composite -- on 2026-09-14
    # a Dependabot pull request rewrote forge-plugin's resolution to `git@github.com:` and all six
    # died inside the install with exit 128, saying nothing a reader could act on (ISS-1045).
    - name: Refuse a lockfile entry that can only be fetched over SSH
      shell: bash
      run: node scripts/check-lockfile-transport.mjs

    - name: Install workspace dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Every workspace dep whose export map points at dist/ is built here, in
    # dependency order. dist/ is gitignored, so a checkout has none of it and a
    # job running `pnpm --filter <pkg> typecheck` directly (not through turbo,
    # which would build deps itself) fails TS2307 on the specifier. Adding a
    # compiled export to a workspace dep means adding it here — @forge/contracts
    # joined on 2026-09-23 when ./document-patch was repointed at dist.
    - name: Prebuild emit-only workspace deps
      if: inputs.prebuild-deps == 'true'
      shell: bash
      run: |
        pnpm --filter @forge/observability build
        pnpm --filter @forge/contracts build
