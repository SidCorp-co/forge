name: CI

# This repo is a pnpm workspace. CI contract:
#   1. ALL jobs that touch a workspace package call the composite action
#      `.github/actions/setup-workspace` for checkout-aware pnpm + Node 22 +
#      frozen-lockfile install. Do NOT add per-job pnpm/setup-node/install
#      steps — the composite is the single source of truth.
#   2. Run commands from the repo root using `pnpm --filter <pkg>`. Do NOT
#      set `defaults.working-directory` — that pattern blocks workspace
#      filters and was the root cause of the npm/pnpm drift in the retired
#      desktop job.
#   3. There is NO per-package package-lock.json. The only lockfile is the
#      root `pnpm-lock.yaml`.
#   4. The `install-check` job runs on every PR with no `if` gate — it
#      catches lockfile/install drift even when no package-specific job
#      fires. If you find yourself disabling it, you're papering over real
#      drift; fix the lockfile instead.

# The branch set this workflow gates is written three times — twice here and once in the `proved`
# step below — because `on:` cannot read a variable. `conformance-audit` R11 holds the three to one
# answer. `dev` is here for the branch work lands on; `main` stays, because it is the branch the
# promotion from `dev` lands on and every check a promotion owes is one a pull request into `dev`
# already ran (ISS-1304).
on:
  push:
    branches: [main, dev]
    # cm:hack ISS-118 until:dev is promoted to main or the owner re-enables CI — every push and pull request on dev skips CI (owner, 2026-10-04); main runs its own copy of this file
    paths-ignore: ['**']
  pull_request:
    branches: [main, dev]
    paths-ignore: ['**']
  # The heavy jobs a pull request no longer waits on also run nightly, 19:00 UTC (ISS-1370), so a
  # red one is found on a day nothing landed as well.
  schedule:
    - cron: '0 19 * * *'
  # The same heavy jobs on a branch before it lands, which a pull request no longer runs:
  # `gh workflow run CI --ref <branch> -f base=<the branch it lands on>`. `base` is required and
  # has no default, because GitHub cannot know where a dispatched branch lands and every
  # delta-scoped gate measures against it (`scripts/lib/base-branch.mjs`).
  workflow_dispatch:
    inputs:
      base:
        description: 'The branch this work lands on (main or dev); the gates measure against it'
        required: true
        type: string

# A pull request's newer run cancels its older one. A push run is never cancelled: since ISS-1370
# the heavy jobs run only there, and a landing cancelled by the next one would be measured by
# nothing — so each push is its own group, keyed on its commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name != 'pull_request' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Dependabot PRs run with a read-only GITHUB_TOKEN by default (since
# Sept 2021), which makes dorny/paths-filter's pulls.listFiles API call
# fail with "Resource not accessible by integration". Declaring read
# scopes explicitly fixes Dependabot PRs without changing behavior for
# pushes or human PRs.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Always-on guardrail: catches lockfile drift, missing package.json
  # entries, and workspace misconfiguration on every PR — including PRs
  # that wouldn't trigger any package-specific job. Cheap (~30s warm,
  # ~90s cold) and high signal: if this fails, every other job would
  # fail too once a path filter happens to match.
  install-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          prebuild-deps: "false"

  # English-only source policy (ISS-65). Runs scripts/check-source-language.mjs
  # in --all mode. Always-on, ungated by paths-filter — language drift can land
  # via any change set. Cheap (~15s); zero-dep script, no pnpm install needed.
  lang-check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing for check-release-record — it compares CHANGELOG.md
      # against the same file at the base revision, and a depth-1 checkout has neither
      # origin/main nor HEAD~1. That checker exits 2 rather than passing on nothing, so
      # dropping this line turns the gate red instead of turning it silent.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/check-source-language.mjs --all
      # The release record: CHANGELOG.md keeps the `## [Unreleased]` heading its five readers
      # parse for, and an entry published there is not removed without a declared reason.
      # 3df9a8e9 removed 1,034 lines of it inside a commit about docs pointers and all twelve
      # gates passed — every axis owned a property of the code and none owned the record.
      - run: node scripts/check-release-record.mjs
      # Test-signal guard: fails only when a test file gets MORE
      # declaration-restating or mock-only assertions than its frozen baseline
      # (.forge/test-signal-baseline.json).
      - run: node scripts/check-test-signal.mjs --all
      # Honest costs: docs/VISION.md and every proposal must say what adopting
      # them takes from whoever adopts it. The convention existed nowhere and
      # was kept nowhere — CLAUDE.md published "a trade-off is priced or it is
      # not taken" while the constitution took its own unpriced. Reads markdown
      # only, so it lives in this install-free job.
      - run: node scripts/check-honest-costs.mjs
      # One question, one answer (ISS-1106): two constants holding the same status tuple, or
      # an inline status array a named constant already holds. Reads TypeScript source text
      # and needs no node_modules, so it lives in this install-free job.
      - run: node scripts/check-status-tuples.mjs --all
      # Migration order across the SET of open branches (ISS-1130). The journal test in
      # packages/core reads one journal — its own — so every branch passes alone while the set is
      # measured by nothing, and drizzle skips an entry below the high-water mark it reads once,
      # silently and for ever (ISS-807). This reads every open branch's journal and refuses a
      # `when` that collides with, straddles or falls below one of them. It lives HERE and not in
      # lang-check's neighbours because `fetch-depth: 0` above is what puts every
      # refs/remotes/origin/* on disk for it; with a depth-1 checkout it would have nothing to
      # compare against, which it reports as exit 2 rather than as a pass.
      - run: node scripts/check-migration-order.mjs
      # Doc citations: a document that names a file in this repo makes a claim a machine
      # can check, and nothing checked it — 93 documents had drifted far enough to be
      # deleted rather than corrected before this landed. Reads markdown and `git ls-files`
      # only, so it lives in this install-free job; the `fetch-depth: 0` above is what lets
      # it date a document against the file it cites, and it says so rather than reporting
      # no drift when the checkout is shallow.
      - run: node scripts/check-doc-citations.mjs --all
      # CI-parity: proves every step in this file is either run by `pnpm verify`
      # or declared as covered by another root script. Without it the local
      # command and this workflow drift, and a green `pnpm verify` stops meaning
      # anything. Lives here because lang-check is always-on and needs no install.
      - run: node scripts/verify.mjs --ci-parity

  # The two checks that need node_modules. They are NOT in lang-check because
  # that job deliberately installs nothing, so it keeps gating language and
  # test-signal even on a PR that breaks the install. Putting these there made
  # check-size-budget exit 2 with "biome output was not JSON" — the checker
  # behaving correctly (a checker that cannot run must never report clean) in a
  # job that could not give it biome. Always-on: a PR touching only
  # .forge/conformance.json must still be measured, so no paths filter.
  conformance:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing — conformance-status compares each baseline
      # against the same file at the base revision, and a depth-1 checkout has no
      # HEAD~1 and no origin/main to compare against. It exits 2 rather than passing
      # on nothing, so this is what lets the ratchet run at all.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      # The checkers in scripts/ are what every other gate runs, and until
      # 2026-08-25 nothing linted or typechecked them: `turbo run lint` only
      # fans out to workspace packages and this directory is in none. Zero
      # violations at rest and no baseline — the 21 found on the day it got a
      # config were fixed, not frozen. Lives in this job rather than lang-check
      # because `pnpm exec biome` needs node_modules and that job installs
      # nothing on purpose.
      # Every tracked test file must be collected by some runner. `packages/tests`
      # held 64 that none did — no package.json, so pnpm never saw the directory
      # — while they tested two packages deleted on 2026-08-23. A file no runner
      # collects emits nothing, so it reads exactly like a suite that passed.
      # Spawns `vitest list` per project, hence this job rather than lang-check.
      - run: node scripts/check-test-reachability.mjs
      - run: pnpm exec biome check scripts
      # Size budget: biome OWNS the two length rules; what it lacks is a
      # baseline, so both sit at `warn` and `biome check` exits 0 with 143
      # violations. This freezes today's 103 offenders (.forge/size-baseline.json)
      # and fails only when a file gets longer or a new one lands over budget.
      - run: node scripts/check-size-budget.mjs --all
      # Lint budget: the same freeze one package over, for the biome rules set
      # to `warn` — biome exits 0 on a warning, so the blocking `core` lint step
      # passed over 280 uncounted diagnostics and web-v2's 215 were checked only
      # by the `web` job, which paths-filter gates on packages/web-v2/** while
      # .forge/lint-baseline.json sits in no filter at all: a baseline-only edit
      # never re-ran its own gate. Here it is always-on, and fetch-depth: 0 above
      # is what lets the drain half resolve a merge-base (ISS-833).
      - run: node scripts/check-lint-budget.mjs --all
      # Comment budget: the third freeze, over comment CONTENT. The codemap checker that owned
      # this axis was deleted with its annotations, and eslint-plugin-code-quality replaced the
      # rules but reached no gate — `pnpm lint:code-quality` sat in no row of verify and no job
      # here, so the axis was written and unmeasured (ISS-1111). Frozen at 73 findings over 67
      # files; .forge/conformance.json's comment axis prices that amnesty and says what ends it.
      # Four rules only: the other halves of that command belong to axes nobody has declared.
      # Lives in this job because it drives ESLint, which needs node_modules.
      - run: node scripts/check-comment-budget.mjs --all
      # Provider literals (ISS-1071): an integration provider is named where a provider is
      # described — its own directory, the registry, the union, the schema vocabulary, the
      # contracts enums, the two login-identity surfaces — and nowhere else. No type can hold
      # this: `IntegrationProvider` makes `'coolify'` legal everywhere the union is in scope,
      # which is what a union is for, so the rule is about LOCATION and only a scan can measure
      # it. Node and nothing else, but it lives here rather than in lang-check because the
      # allowed locations are read out of .forge/conformance.json, which this job already gates.
      - run: node scripts/check-provider-literals.mjs --all
      # Integration declarations (ISS-1071): walks the LIVE registry and fails naming a provider
      # whose declaration is missing a field the generic paths read. It spawns `tsx` on a probe,
      # so it needs node_modules and belongs in this job rather than in lang-check. The rule with
      # teeth is the `justification` on a `direct-mcp` arm: that arm renders a project's
      # credential into a runner box's MCP config and puts Forge outside the call path, and the
      # field is the only place that decision is written down.
      - run: node scripts/check-integration-declarations.mjs --all
      # Lazy module init (ISS-1067): `config/env.ts` validates the environment and `db/client.ts`
      # constructs the postgres pool on the first READ of their exports, never at import. One new
      # module-scope read of either puts the side effect back for every module downstream of that
      # file, and it breaks nothing on the day it lands — the failure arrives later as a stack with
      # no assertion in it, which is what PR #457's `core-integration` job reported: three frames,
      # three skipped cases and no test name. No type can hold it, so the rule is an AST walk.
      # Needs node_modules for the TypeScript parser, hence this job rather than lang-check.
      - run: node scripts/check-lazy-module-init.mjs --all
      # API contracts (ISS-18): packages/core/contracts/ publishes forge-api (OpenAPI 3.1, every
      # route index.ts mounts, inputs read off the zod validators) and forge-mcp (the tools
      # tools/list serves), and a differ reads those files, not the code. This regenerates both
      # from the running app and fails naming each route or tool whose committed entry differs,
      # or that the generator cannot describe. It imports the whole core app under tsx, so it
      # needs node_modules and the prebuilt workspace deps, and lives in this always-on job
      # because a contract can move from packages/core, packages/contracts or the lockfile.
      # FORGE_API_CONTRACTS_DIR keeps that one generation, stamped with this tree, so the
      # conformance-status step below reads it rather than importing the app a second time.
      - run: node scripts/check-api-contracts.mjs
        env:
          FORGE_API_CONTRACTS_DIR: ${{ runner.temp }}/forge-api-contracts
      # PAT surface (ISS-28): every route the running app serves under a project-reach permission
      # must reach the PAT fence through functions the type checker resolves, one route at a
      # time. It reads `app.routes` under tsx and runs the TypeScript compiler, so it needs
      # node_modules and the prebuilt workspace deps, the same as the contracts above.
      - run: node scripts/check-pat-surface.mjs
      # Conformance levels: runs each axis's checker and fails when what it
      # actually does disagrees with the level .forge/conformance.json claims
      # for it. Every gate this repo lost was lost by staying documented while
      # it stopped blocking; this is the check that notices.
      - run: node scripts/conformance-status.mjs
        env:
          FORGE_API_CONTRACTS_DIR: ${{ runner.temp }}/forge-api-contracts
      # Conformance audit: the only check whose SUBJECT is the setup itself.
      # `status` asks whether each axis does what it claims; this asks whether
      # the setup around them still has the shape the manifest's `profile`
      # claims — an entrypoint, scan proof on every check, a baseline with a
      # direction, every needs-job asserted, both meta-checks, no level that
      # blocks where nothing blocks. Without it a repo can gate nothing and
      # still be perfectly conformant, which is the hole it exists to close.
      - run: node scripts/conformance-audit.mjs

  # Knowledge axis, node and nothing else. Holds the DOC surfaces injected into every session —
  # guide bodies and the mandatory facts, which reach every project whatever its pipeline mode.
  # Two rules: a status transition names the mode it belongs to, and a pipeline STEP named as the
  # actor of something the reader is told about does too — staged and autonomous share no step.
  # It cannot tell whether the prose around a qualified claim is true, and it never sees a
  # project's own knowledge entries: those live in the database, and "node and nothing else" is
  # precisely why they are out of reach here rather than merely unwritten.
  injected-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/check-injected-doc-modes.mjs
      # ISS-1046 — the readers of the retired release model that no type can see.
      - run: node scripts/check-retired-model.mjs

  archmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      # All eight contracts are locked. Seven are green at zero debt (four core
      # purity, three web boundary); `no-coordinator-blob` carries 13 violations
      # frozen in .arch.baseline.json by `archmap lock`, so it blocks the 14th
      # while the debt stays visible. exit 1 = a NEW violation · exit 2 = the
      # gate could not run (unreadable manifest, a scope matching no files) — never read 2 as a pass.
      # The three web contracts only mean anything because `.arch.json` declares a tsConfig: without
      # it dependency-cruiser resolves nothing through web-v2's `@/*` alias, and an unresolvable edge
      # is dropped rather than reported, so they would pass on an empty graph. conformance-audit R7
      # holds that ceiling.
      # The vendored copy in .forge/archmap is the authority: a contributor without a global
      # install and this job are held to the same reviewed version.
      # Preflight FIRST. archmap's own exit 2 cannot name what stopped it: with no `go.mod`
      # here its Go provider returns an empty-but-ok graph, so `buildScope` prints
      # `scope matched no files (.)` and discards the TypeScript provider's reason. That
      # sentence is about this repo's SCOPE, and it was the only thing #369, #394, #425 and
      # #448 ever said about a file dependency-cruiser 18.3.0 renamed (ISS-1098). Both steps
      # exit 2 for the same proposition — the gate could not run — and neither is a pass.
      - run: node scripts/check-archmap-ready.mjs
      - run: ./.forge/archmap/archmap check

  changes:
    runs-on: ubuntu-latest
    # A job's own `permissions` replace the workflow's, so the two it reads are restated beside
    # the one the `proved` step adds: `checks: read`, for the ci-passed run it asks about.
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      core: ${{ steps.filter.outputs.core }}
      runner: ${{ steps.filter.outputs.runner }}
      docs: ${{ steps.filter.outputs.docs }}
      scripts: ${{ steps.filter.outputs.scripts }}
      proved: ${{ steps.proved.outputs.proved }}
    steps:
      - uses: actions/checkout@v7
      # A merge commit on `main` carries a tree a `pull_request` run has ALREADY
      # built and tested when the branch was up to date: GitHub runs those on
      # `refs/pull/N/merge`. ISS-1370 turns branch protection's `strict` off, so a
      # branch may now merge while behind, and that merge carries a tree no
      # pull_request run built — the tree check below reads it `proved=false`. Re-running
      # `core`, `web` and `runner` over it buys nothing, and
      # measured over 400 runs (2026-09-09..16) it was 88 of them, 22% of all CI.
      # `core-integration`, `images`, `whole-tree` and `runner-platforms` do NOT
      # read it: since ISS-1370 a pull request never runs them, so the push is the
      # only run that does and nothing has proved that tree for them.
      # The two merge-commit reds in that window were both infrastructure, not
      # drift: a Docker Hub manifest timeout pulling pgvector, and a pg-boss
      # enqueue failure — neither reachable by this filter.
      # A parent count alone proves none of that, so three things are read and all
      # three must hold. Two parents, off the commit object's header: this checkout
      # is depth 1, where the shallow graft leaves every commit parentless to
      # `git rev-list` and `git log`, so either would count 1 on every merge
      # (ISS-1340). A tree equal to the second parent's, so a merge
      # carrying content its pull request never held — resolved by hand, or merged
      # while behind — is not waved through. And that parent's latest `ci-passed`
      # concluded `success`, because `enforce_admins` is false and a merge taken
      # past red carries two parents too. Anything else, or a read that fails, is
      # `proved=false` with its reason logged, so a DIRECT push — the owner lane,
      # which sees no pull_request run at all — keeps the full gate. It went red 16
      # times in that same window. `scripts/lib/proved-step.test.mjs` runs this
      # shell as written.
      # The cheap always-on jobs (lang-check, conformance, archmap, docs,
      # injected-docs, install-check) are NOT gated on this: they cost seconds,
      # they are ungated by paths-filter on purpose, and `docs` walks the whole
      # tree so a merge CAN break a link no PR run saw.
      - name: Whether a pull_request run already proved this exact tree
        id: proved
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          proved=false
          why="a ${GITHUB_EVENT_NAME} event to ${GITHUB_REF}, which no pull_request run precedes"
          gated="refs/heads/main refs/heads/dev"
          case " $gated " in
            *" ${GITHUB_REF} "*) on_gated_branch=true ;;
            *) on_gated_branch=false ;;
          esac
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "$on_gated_branch" = true ]; then
            if ! object=$(git cat-file -p HEAD); then
              why="could not read HEAD's commit object"
            else
              # Header lines only: a message line reading `parent <sha>` is not a parent.
              parents=$(printf '%s\n' "$object" | sed -n '/^$/,$d; s/^parent //p')
              tree=$(printf '%s\n' "$object" | sed -n '/^$/,$d; s/^tree //p')
              count=0
              for _ in $parents; do count=$((count + 1)); done
              pr_head=$(printf '%s\n' "$parents" | sed -n 2p)
              if [ "$count" -ne 2 ]; then
                why="HEAD has $count parent(s), and only a two-parent merge follows a pull_request run"
              elif ! git fetch --quiet --no-tags --depth=1 origin "$pr_head"; then
                why="could not fetch the second parent $pr_head to read its tree"
              elif [ "$(git rev-parse --verify --quiet "$pr_head^{tree}" || true)" != "$tree" ]; then
                why="HEAD's tree differs from its second parent $pr_head's, so no pull_request run built it"
              elif ! verdict=$(gh api --paginate --slurp \
                  "repos/${GITHUB_REPOSITORY}/commits/$pr_head/check-runs?check_name=ci-passed&per_page=100" |
                  jq -r '[.[].check_runs[] | select(.app.slug == "github-actions")] | sort_by(.id) | last
                    | if . == null then "absent" elif .status != "completed" then .status else .conclusion end'); then
                why="could not read ci-passed on $pr_head from the check-runs API"
              elif [ "$verdict" != "success" ]; then
                why="ci-passed on $pr_head reads ${verdict:-nothing}, not success"
              else
                proved=true
                why="two parents, the tree of $pr_head, and its ci-passed concluded success"
              fi
            fi
          fi
          echo "proved=$proved" >> "$GITHUB_OUTPUT"
          echo "why: $why"
          echo "pull_request run already proved this tree: $proved"
      # A scheduled run has no pushed range to diff, and its jobs select on the event instead.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'schedule'
        with:
          # NB: dorny/paths-filter treats `!pattern` entries as separate
          # positive matchers ("match files NOT matching pattern"), not as
          # subtractions from the match set. With the default
          # `predicate-quantifier: some`, a `!**/*.md` line would make a
          # filter match any non-MD file in the diff. Don't use negations
          # here — keep filters as plain positive include lists.
          filters: |
            # `packages/core/**` is here because `pnpm --filter web-v2 build` type-checks
            # core's SOURCES, not a built .d.ts — so a core-only change can break the web
            # build while the job that would catch it is skipped, and a skipped job passes
            # `ci-passed`. That is not hypothetical: `39431309` added a regex `s` flag in
            # `chat/providers/gemini.ts`, `web` was skipped on every run that carried it,
            # and the first thing to notice was a production deploy failing on TS1501.
            # The cost is the ~3m45s `web` job on every core PR, run beside `core` and
            # finished before it, and it is the honest price of the dependency being real.
            web:
              - 'packages/web-v2/**'
              - 'packages/contracts/**'
              - 'packages/core/**'
              - 'packages/observability/**'
              - '.npmrc'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - 'scripts/lib/whole-tree-*.mjs'
              - 'scripts/check-whole-tree-gates.mjs'
            # `.npmrc` sits under both because it decides how EVERY package resolves its
            # modules: `node-linker=hoisted` is what lets four packages only `@forge/core`
            # declares resolve from the repository root, and `pnpm verify` loses five
            # verdicts without them. It matched no filter, so a change to it skipped `core`,
            # `web`, `core-integration` and `runner` at once — and a skipped job passes
            # `ci-passed`, which is the shape `39431309` already cost a production deploy.
            # `pnpm-lock.yaml`, the root `package.json` and `pnpm-workspace.yaml` sit under
            # both for the same reason: they decide which versions web-v2 installs, so a
            # dependency bump can break its build. `web` skipped on exactly that change, a
            # bump touching only `package.json` and the lockfile (#785, ISS-1348), and
            # web-v2 was proved by hand before it landed (ISS-1364). The price is the ~3m45s
            # `web` job on each such change, and they are rare.
            # A workspace package sits under the filter of every job that tests a package
            # depending on it. `@forge/observability` has no job of its own and matched no
            # filter, so a change to it alone skipped `core`, `core-integration` and `web`,
            # both of whose packages import it (ISS-1364). `@forge/contracts` selected `web`
            # but not `core`, which imports it too. `core-integration` rides `core`'s output.
            core:
              - 'packages/core/**'
              - 'packages/contracts/**'
              - 'packages/observability/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'
              - 'scripts/lib/whole-tree-*.mjs'
              - 'scripts/check-whole-tree-gates.mjs'
            runner:
              - 'packages/runner/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '**.md'
            # scripts/**/*.test.mjs is collected by packages/core/vitest.config.ts and by
            # nothing else, so those tests run only when the `core` job does — a
            # scripts-only PR skipped them, and a skipped job passes `ci-passed`. Its own
            # output rather than a line under `core:`, because `core` also gates
            # core-integration, and making every checker edit pay a Testcontainers run is a
            # cost with no test in it.
            scripts:
              - 'scripts/**'

  web:
    needs: changes
    if: needs.changes.outputs.proved != 'true' && (needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter web-v2 lint
      # `@forge/contracts` had a test file and no `test` script, so no job on this
      # workflow ever ran `packages/contracts/src/*.test.ts` — `issue-vocabulary.test.ts`
      # was 11 assertions that could not go red anywhere (found by ISS-970, which
      # needed one of them to be load-bearing). It rides the `web` job because this
      # job's path filter already fires on `packages/contracts/**` and web-v2 is the
      # package that consumes the values.
      - run: pnpm --filter @forge/contracts test
      - run: pnpm --filter web-v2 exec vitest run --passWithNoTests
      - run: pnpm --filter web-v2 build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api

  core:
    needs: changes
    if: needs.changes.outputs.proved != 'true' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.scripts == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      # BLOCKING since 2026-08-11. Ran non-blocking for months and drifted to 366
      # errors, 192 of them pure formatting. Now 0 errors — biome exits non-zero
      # only on errors, and `noNonNullAssertion` / `noExplicitAny` /
      # `noExcessiveLinesPerFile` / `noExcessiveLinesPerFunction` are configured
      # "warn" in packages/core/biome.json on purpose, so the ~460 warnings (size
      # and typing debt, tracked not gated) do not fail the job. A failure here is
      # a real new violation.
      - run: pnpm --filter @forge/core lint
      - run: pnpm --filter @forge/core test
      # BLOCKING since 2026-08-10. `typecheck` uses the base tsconfig, which
      # includes test files (build uses tsconfig.build.json and excludes them).
      # It carried 84 pre-existing errors — weakly-typed mock access
      # (`spy.mock.calls[0][0]` on a 0-arg `vi.fn()`), `res.json<T>()` after
      # Hono dropped the type arg, and noUncheckedIndexedAccess — and ran
      # non-blocking for months, so it drifted. Cleared to 0; gated so it stays
      # there. A new failure here is a real type error, not legacy noise.
      - run: pnpm --filter @forge/core typecheck
      - run: pnpm --filter @forge/core build
      # Integration tests run in `core-integration` below, after the merge.

  # Integration tests (Testcontainers) for core. POST-MERGE since ISS-1370: it
  # runs on the push to a gated branch, nightly and on a dispatch, never on a pull request,
  # and `ci-passed` does not need it. It gated from 2026-07-10 because the
  # first "visibility-only" run sat red for a week (8 rotted tests) while
  # everyone learned to ignore it — the price `.forge/conformance.json`
  # `$postMerge` names, taken on the owner's ruling that forge-dev, a beta with
  # no production, ships fast. This suite asserts real-Postgres behavior and
  # applies every migration on a fresh DB, so a red here is fixed forward by
  # whichever run lands next, before anything else.
  core-integration:
    needs: changes
    if: github.event_name != 'pull_request' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.core == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      # The coverage variant of test:integration:ci — same suite, same container
      # mode, plus the v8 report that check-flow-coverage reads. Coverage costs a
      # couple of seconds on an 85s run, and it is the ONLY place the e2e report
      # is produced, so the flow gate below has evidence to work from.
      - run: TEST_DB_MODE=container pnpm --filter @forge/core test:integration:coverage
      # --require-sources turns "no coverage report" from a local skip into a
      # failure. `pnpm verify` skips this check when the report is absent; that
      # skip is only honest because this step exists and ci-parity proves it does.
      - run: node scripts/check-flow-coverage.mjs --all --require-sources

  # Merge gate for the Rust runner. It lives inside CI so `ci-passed` can gate
  # on it via paths-filter: a path-triggered workflow of its own CANNOT be a
  # required check — a PR not touching the runner would never run it and the
  # required check would pend forever.
  # The runner ships a binary for three platforms. Since ISS-1370 a pull
  # request runs the tests on ubuntu alone and clippies Windows and macOS from
  # it; the macOS and Windows builds and tests run in `runner-platforms` after
  # the merge. That is the shape which let two windows-only classes reach
  # `main` once already — on 2026-09-09 `build (windows-latest)` went red on PR
  # #336 while `ci-passed` went green (a `cfg(unix)`-only dep used
  # unconditionally, and a source scan splitting on `"\n}\n"` that under CRLF
  # measured the whole file) — and it is priced in `.forge/conformance.json`
  # `$postMerge`. The release builds both binaries itself in
  # runner-release.yml, so a red leg here is found before or at the release.
  runner:
    needs: changes
    if: needs.changes.outputs.proved != 'true' && (needs.changes.outputs.runner == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/runner
      # Compile and lint errors for the two platforms a pull request no longer builds on still gate
      # it (ISS-1370): clippy type-checks every `cfg(windows)` and `cfg(target_os = "macos")` path
      # without linking, which is the class of #816, an unused import behind `cfg(windows)`. Runtime
      # differences — CRLF, path separators, temp-dir symlinks — are NOT caught here; they are
      # `runner-platforms`', after the merge. `ring` and `libsqlite3-sys` compile C in their build
      # scripts and this image has no Windows or macOS C toolchain, so CC and AR for both targets
      # are `true`: clippy links nothing, and that vendored C is built for real by
      # `runner-platforms` and runner-release.yml.
      - name: Cross-target clippy for Windows and macOS
        working-directory: packages/runner
        shell: bash
        env:
          CC_x86_64_pc_windows_gnu: 'true'
          AR_x86_64_pc_windows_gnu: 'true'
          CC_x86_64_apple_darwin: 'true'
          AR_x86_64_apple_darwin: 'true'
        run: |
          rustup target add x86_64-pc-windows-gnu x86_64-apple-darwin
          # Both targets run whatever the first says, so one push names every target it breaks.
          failed=""
          for target in x86_64-pc-windows-gnu x86_64-apple-darwin; do
            cargo clippy --workspace --all-targets --target "$target" -- -D warnings || failed="$failed $target"
          done
          if [ -n "$failed" ]; then echo "::error::cross-target clippy failed for:$failed"; exit 1; fi
      # The tests that drive a master pane through a real tmux server return early where tmux is
      # absent, and a return passes green having asserted nothing — so whether this gate caught
      # the ensure_master mutants they exist for rested on what the image happened to carry
      # (ISS-1235). Linux installs tmux (the ubuntu image carries it today; nothing promises
      # that) and sets FORGE_TEST_REQUIRE_TMUX, under which such a test fails naming what it
      # lacked instead of returning. macOS resolves the config dir, and so the socket, outside
      # XDG_CONFIG_HOME, so a test there cannot get a server of its own and still skips;
      # Windows does not compile the module. Clippy denies warnings, here, in runner-release.yml's
      # check job and in scripts/check-runner-gates.mjs alike: a lint that only warns is read by
      # nobody, and five stood on main that way.
      - name: Lockfile sync + fmt + clippy + test
        working-directory: packages/runner
        shell: bash
        env:
          FORGE_TEST_REQUIRE_TMUX: ${{ runner.os == 'Linux' && '1' || '' }}
        # Anchored: `runner-platforms` runs this same script by alias, so the two cannot drift.
        run: &runner-gate |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q && sudo apt-get install -y -q tmux
            tmux -V
          fi
          cargo metadata --locked --format-version=1 >/dev/null
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

  # The `runner` gate, by the `*runner-gate` alias, on the two platforms a pull request no longer
  # waits on (ISS-1370). Post-merge, nightly and on a dispatch; `ci-passed` does not need it,
  # `$postMerge` names it.
  runner-platforms:
    needs: changes
    if: github.event_name != 'pull_request' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.runner == 'true')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/runner
      - name: Lockfile sync + fmt + clippy + test
        working-directory: packages/runner
        shell: bash
        run: *runner-gate

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: yes
          config-file: .github/mlc-config.json

  # The only gate that builds what actually ships. Every other job measures the
  # source tree; the images COPY `.npmrc pnpm-workspace.yaml package.json
  # pnpm-lock.yaml` and `packages` and nothing else, so a dependency the repo
  # grows OUTSIDE that set is invisible to all of them and surfaces first on the
  # deploy. That is not hypothetical: at `fd3230e93` the whole gate was green and
  # Coolify failed twice — a root devDependency declared `file:.forge/code-quality`
  # (pnpm exit 254) and a `scripts/lib/test-workers.mjs` import (TS2307), neither
  # path reaching the image. Both fixed in `259ba7657`; this job is what would
  # have caught them.
  #
  # The build runs against `git archive`, not the checkout. A working-tree build
  # succeeds on any file the runner happens to hold and the image does not, which
  # is precisely the defect class this job exists for.
  #
  # NOT path-filtered on purpose. A filter would have to enumerate "files outside
  # the COPY set", which is the reasoning that fails here by construction.
  # POST-MERGE since ISS-1370: every push to a gated branch, nightly and on a dispatch, never a
  # pull request, and `ci-passed` does not need it — so the defect class above
  # now reaches `main` and is found there (`.forge/conformance.json` `$postMerge`).
  images:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/build-images.mjs

  # A test whose input is the whole repository, selected by its own declaration rather than by
  # where it lives. `changes` picks a job by the paths a pull request touched, which is right for a
  # test of one module and wrong for a guard that walks every file: #710 changed only documents,
  # `core` was skipped, and the guard that document broke merged green and left `main` red for the
  # next branch to find (ISS-1314). A test carrying `@gate-input whole-tree` runs here on every
  # push to a gated branch, nightly and on a dispatch; the checker refuses one that walks from the root without
  # it. NOT path-filtered on purpose. POST-MERGE since ISS-1370, like `images`: a pull request
  # never runs it and `ci-passed` does not need it, which is #710's shape again, priced in
  # `.forge/conformance.json` `$postMerge`.
  whole-tree:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: node scripts/check-whole-tree-gates.mjs --run

  # ───────────────────────────────────────────────────────────────────────
  # Single aggregate gate. Branch protection should require ONLY this check
  # (drop the lone `changes` requirement). Requiring the individual jobs
  # directly does NOT work: the package jobs are path-gated with `if:` and
  # report `skipped` on PRs that don't touch them, which a required check
  # treats as "pending" → blocks merge forever. This job depends on all of
  # them with `if: always()` and fails only when a dependency genuinely
  # `failure`d or was `cancelled` (a `skipped` path-filtered job passes). It
  # makes CI — not the local pre-push hook, which contributors may not have
  # installed and can bypass — the authoritative merge gate. The blocking
  # signals it enforces today: install-check, lang-check, conformance,
  # archmap, injected-docs, the affected package build(s)+test(s) — the Rust
  # runner gate on ubuntu among them — and markdown-link integrity. It does
  # NOT need `core-integration`, `images`, `whole-tree` or `runner-platforms`:
  # those run after the merge (ISS-1370), a red there is fixed forward, and
  # `.forge/conformance.json` `$postMerge` holds the list conformance-audit R12
  # compares this one against.
  # (`core build` runs `tsc -p tsconfig.build.json`; the test-inclusive
  # `typecheck` and `lint` became blocking inside the `core` job on
  # 2026-08-10/11 once their debt reached 0. Both had drifted for months
  # precisely because nothing failed on them.)
  ci-passed:
    if: always()
    needs:
      [
        install-check,
        lang-check,
        changes,
        web,
        core,
        runner,
        docs,
        injected-docs,
        archmap,
        conformance,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to have passed or been skipped
        run: |
          for r in \
            "install-check:${{ needs.install-check.result }}" \
            "lang-check:${{ needs.lang-check.result }}" \
            "changes:${{ needs.changes.result }}" \
            "web:${{ needs.web.result }}" \
            "core:${{ needs.core.result }}" \
            "runner:${{ needs.runner.result }}" \
            "docs:${{ needs.docs.result }}" \
            "injected-docs:${{ needs.injected-docs.result }}" \
            "archmap:${{ needs.archmap.result }}" \
            "conformance:${{ needs.conformance.result }}"; do
            echo "$r"
            result="${r##*:}"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::CI gate: job '${r%%:*}' did not pass (result=$result)"
              FAILED=1
            fi
          done
          if [ "${FAILED:-0}" = "1" ]; then
            exit 1
          fi
          echo "CI gate: all jobs passed or were skipped."

  # e2e-web removed for v0.1 alpha. Browser e2e was brittle on a
  # single-spec happy-path; cost > value at this stage. Reinstate when the
  # surface stabilises and there's a reason to gate PRs on UI flows.
