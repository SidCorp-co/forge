name: runner-autorelease

# A change under `packages/runner/` that lands on `main` becomes an installable
# build, without anybody remembering to cut a tag.
#
# Before this existed, `runner-v*` tags were a hand act. Measured 2026-09-21:
# seven runner commits sat on `main` past the last tag, every box was still
# running the binary from before them, and nothing anywhere read as anything but
# healthy — `packages/runner/Cargo.toml` still declared the released version, so
# the box and `main` reported the same number over different code (ISS-1165).
#
# What it produces: the tag `runner-v<next>` at the commit that landed, and —
# through runner-release.yml, called from here rather than triggered by the tag —
# a GitHub Release carrying the two `forge-runner-<target>` binaries, `VERSION`
# and `COMMIT`. Core's `fetch-release.js` picks that up within 30 minutes and
# boxes with `update.auto` apply it on their next check.
#
# A push to `dev` touching the runner cuts the dev line instead (ISS-1358): the tag
# `runner-v<newest main release on the line>-dev.<n>`, published as a GitHub
# prerelease through the same runner-release.yml, so `main`'s line, which reads
# no prerelease, is unchanged. A core whose RUNNER_RELEASE_CHANNEL is `dev` serves
# it; every other core never sees it.
#
# A commit is released only where a GitHub Release is PUBLISHED for its line's tag at
# it (ISS-1373). The tag is cut before the build, so a failed or skipped build leaves
# a tag with no release; the next run for that commit builds and publishes under that
# same tag, computing no new version and moving no tag.
on:
  push:
    branches: [main, dev]
    paths:
      - "packages/runner/**"
      # how the runner is built is part of the runner: a change to its build releases
      # the newest runner commit, as the step below names it (ISS-1358), and so does a
      # change to how that release is numbered and tagged (ISS-1373) — where that
      # commit has no published release on its line yet. Where it has one, nothing new
      # is released: the tag job ends green with a notice and the release job is skipped.
      - ".github/workflows/runner-release.yml"
      - "scripts/cut-runner-tag.mjs"
      - "scripts/next-runner-version.mjs"

permissions:
  contents: write

# Two merges landing together must not compute the same next version in
# parallel. They are serialised here; the tag push itself is the second defence,
# and refuses rather than moving a tag somebody else cut. Each line queues apart,
# so a dev push never cancels a release of `main` waiting in the group.
concurrency:
  group: ${{ github.ref_name == 'dev' && 'runner-autorelease-dev' || 'runner-autorelease' }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      sha: ${{ steps.head.outputs.sha }}
      owed: ${{ steps.cut.outputs.owed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The next version is read off the existing `runner-v*` tags, so the
          # tags have to be here: a shallow checkout would compute the manifest's
          # own version every time and collide on the first push.
          fetch-depth: 0
      # The identity a release carries is the newest commit that TOUCHED the runner,
      # not the head of the push. A push can carry a runner commit followed by an
      # unrelated one; stamping the push head would leave the binary claiming a
      # commit that core's own path-filtered read of the branch never returns, and
      # every freshly updated box would read as behind for ever.
      - name: The runner this release is cut from
        id: head
        run: echo "sha=$(git log -1 --format=%H -- packages/runner)" >> "$GITHUB_OUTPUT"
      # A tag is not a release: only a published (non-draft) GitHub Release is. The
      # scripts read this list from a file and never call the network themselves.
      - name: The runner releases already published
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | .tag_name' > "$RUNNER_TEMP/published-releases.txt"
      # Where the commit's own line tag stands unpublished, this is that tag's version.
      - name: The version this release carries
        id: next
        env:
          CHANNEL: ${{ github.ref_name }}
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          node scripts/next-runner-version.mjs --channel "$CHANNEL" --sha "$SHA" \
            --published "$RUNNER_TEMP/published-releases.txt" >> "$GITHUB_OUTPUT"
      # An unpublished tag already at the commit is reused: nothing pushed, nothing moved.
      # A commit already released on its line cuts nothing and owes no release (a push
      # changing only the release scripts): a notice, never a red run.
      - name: Cut the tag
        id: cut
        env:
          TAG: ${{ steps.next.outputs.tag }}
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/cut-runner-tag.mjs "$TAG" "$SHA" --published "$RUNNER_TEMP/published-releases.txt" \
            --skip-released --output "$GITHUB_OUTPUT"

  # Called, not triggered: a tag pushed with this workflow's own GITHUB_TOKEN
  # does not start a workflow run, so the release has to be invoked here.
  release:
    needs: tag
    if: needs.tag.outputs.owed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/runner-release.yml
    with:
      version: ${{ needs.tag.outputs.version }}
      sha: ${{ needs.tag.outputs.sha }}
