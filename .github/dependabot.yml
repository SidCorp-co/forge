version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" only scans .github/workflows — composite actions must list their
    # own directory or their `uses:` pins silently rot (setup-workspace sat
    # on deprecated node20 actions for months with zero dependabot PRs).
    directories:
      - "/"
      - "/.github/actions/setup-workspace"
    schedule:
      interval: "weekly"
    # Dependabot rebases an open PR on EVERY push to main, and each rebase fires a
    # full CI run. Measured 2026-09-09..16: `majors-90b0c84545` ran CI 4 times and
    # failed identically all 4; `minor-and-patch-9d2cc350ae` ran 5 times and failed
    # all 5 — ~9 full runs on two PRs that were never going to go green, against 89
    # direct pushes to main in the same week. Disabled means the PR keeps the base
    # it opened against; `@dependabot rebase` still works when a rebase is wanted,
    # and branch protection (`strict: true`) refuses a stale branch at merge time,
    # so nothing lands un-rebased.
    rebase-strategy: "disabled"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      # Actions bumps are almost always runtime-only (nodeXX) — one PR per
      # round beats 4-5 singletons; majors still require manual review via
      # the dependabot-auto-merge policy.
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
      actions-majors:
        update-types: ["major"]

  # npm ecosystem — explicitly list workspace package.json paths. Root
  # package.json owns turbo + pnpm config; the other entries are pnpm
  # workspace members. minor+patch are grouped to keep PR volume sane;
  # majors land as individual PRs for review.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/contracts"
      - "/packages/core"
      - "/packages/web-v2"
    schedule:
      interval: "weekly"
    # Dependabot rebases an open PR on EVERY push to main, and each rebase fires a
    # full CI run. Measured 2026-09-09..16: `majors-90b0c84545` ran CI 4 times and
    # failed identically all 4; `minor-and-patch-9d2cc350ae` ran 5 times and failed
    # all 5 — ~9 full runs on two PRs that were never going to go green, against 89
    # direct pushes to main in the same week. Disabled means the PR keeps the base
    # it opened against; `@dependabot rebase` still works when a rebase is wanted,
    # and branch protection (`strict: true`) refuses a stale branch at merge time,
    # so nothing lands un-rebased.
    rebase-strategy: "disabled"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # Amnesty (ISS-1354): dependency-cruiser is held at 18.2.0, exact, in
    # packages/core/package.json. 18.3.0 renamed its CLI to
    # bin/dependency-cruiser.mjs, and the vendored archmap 0.1.4 spawns only
    # bin/dependency-cruise.mjs, so any newer version takes the relations gate
    # down. Traded: dependency-cruiser's fixes after 18.2.0. Ends when archmap
    # releases its ISS-10 fix (on archmap master since 2026-09-18, in no tag):
    # run `archmap install --force`, then remove this entry and the exact pin.
    # Amnesty (ISS-1342): typescript is held at 5.9.3, exact, in every package.json.
    # typescript-eslint 8.71.2 throws "typescript-eslint does not support TS 7.0", and
    # TypeScript 7 exports no compiler API, which scripts/check-lazy-module-init.mjs and
    # core's fixtures read. Traded: TypeScript 7's compiler speed. Ends when
    # typescript-eslint ships TS 7 support (typescript-eslint issue 10940): bump all four
    # manifests, then remove this entry.
    # pg-boss-v10 is core's test-only alias of pg-boss 10.4.2, which seeds the schema the
    # v10 carry (packages/core/src/queue/v10-carry.ts) reads; both leave at the next pg-boss
    # major, which a pg-boss 10 database reaches only through this release.
    ignore:
      - dependency-name: "dependency-cruiser"
        versions: [">18.2.0"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pg-boss-v10"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      # Majors grouped into ONE PR per round: the pnpm workspace has a single
      # lockfile, so per-directory major PRs (typescript ×4, vitest ×4, …)
      # all collide on pnpm-lock.yaml — merging one conflicted the rest. One
      # grouped PR = one review + one lockfile resolution. Auto-merge still
      # skips majors (dependabot-auto-merge.yml flags them deps:needs-review).
      majors:
        update-types: ["major"]

  # Cargo for the headless runner daemon. packages/runner/ is the only Cargo
  # project; packages/core/ and packages/web-v2/ are pure TS.
  - package-ecosystem: "cargo"
    directory: "/packages/runner/"
    schedule:
      interval: "weekly"
    # Dependabot rebases an open PR on EVERY push to main, and each rebase fires a
    # full CI run. Measured 2026-09-09..16: `majors-90b0c84545` ran CI 4 times and
    # failed identically all 4; `minor-and-patch-9d2cc350ae` ran 5 times and failed
    # all 5 — ~9 full runs on two PRs that were never going to go green, against 89
    # direct pushes to main in the same week. Disabled means the PR keeps the base
    # it opened against; `@dependabot rebase` still works when a rebase is wanted,
    # and branch protection (`strict: true`) refuses a stale branch at merge time,
    # so nothing lands un-rebased.
    rebase-strategy: "disabled"
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Stubs kept commented for future ecosystems; uncomment if/when adopted.

  # - package-ecosystem: "pip"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"

