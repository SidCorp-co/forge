<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
  </defs>

  <rect x="0" y="0" width="1120" height="560" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1119" height="559" rx="14" fill="none" stroke="#d1d9e0"/>

  <!-- ══ CORE ══ -->
  <rect x="756" y="34" width="330" height="492" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-opacity=".45"/>
  <text x="776" y="60" fill="#0969da" font-size="14.5" font-weight="700">forge · control plane</text>
  <text x="776" y="79" fill="#8c959f" font-size="11.5">packages/core — Hono</text>

  <rect x="776" y="94" width="290" height="46" rx="7" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="794" y="115" fill="#1f2328" font-size="13" font-weight="700">REST</text>
  <text x="850" y="115" fill="#8c959f" font-size="12">/api/*</text>
  <text x="794" y="132" fill="#8c959f" font-size="11">per-domain route modules</text>

  <rect x="776" y="148" width="290" height="46" rx="7" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="794" y="169" fill="#1f2328" font-size="13" font-weight="700">MCP</text>
  <text x="850" y="169" fill="#8c959f" font-size="12">/mcp · JSON-RPC</text>
  <text x="794" y="186" fill="#8c959f" font-size="11">a sibling surface, not a wrapper</text>

  <rect x="776" y="202" width="290" height="46" rx="7" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="794" y="223" fill="#1f2328" font-size="13" font-weight="700">WS</text>
  <text x="850" y="223" fill="#8c959f" font-size="12">/ws · core is the server</text>
  <text x="794" y="240" fill="#8c959f" font-size="11">device-room · project-room</text>

  <rect x="776" y="266" width="290" height="88" rx="7" fill="#ffffff" stroke="#0969da" stroke-opacity=".3"/>
  <text x="794" y="288" fill="#0969da" font-size="12.5" font-weight="700">state, and the refusals guarding it</text>
  <text x="794" y="308" fill="#59636e" font-size="11.5">one writer per transition</text>
  <text x="794" y="325" fill="#59636e" font-size="11.5">constraints the database enforces</text>
  <text x="794" y="342" fill="#59636e" font-size="11.5">Postgres 17 · pgvector</text>

  <rect x="776" y="368" width="290" height="70" rx="7" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="794" y="390" fill="#1f2328" font-size="12.5" font-weight="700">what core never does</text>
  <text x="794" y="409" fill="#8c959f" font-size="11.5">hold Claude credentials</text>
  <text x="794" y="426" fill="#8c959f" font-size="11.5">push work, or rank it</text>

  <text x="776" y="464" fill="#8c959f" font-size="11.5">A project designates plugins;</text>
  <text x="776" y="481" fill="#8c959f" font-size="11.5">each device resolves its own set.</text>
  <text x="776" y="498" fill="#8c959f" font-size="11.5">Core does not know which.</text>

  <!-- ══ CLIENTS ══ -->
  <rect x="34" y="34" width="228" height="48" rx="7" fill="#ffffff" stroke="#8250df" stroke-opacity=".5"/>
  <text x="52" y="56" fill="#8250df" font-size="13" font-weight="700">browser</text>
  <text x="52" y="73" fill="#8c959f" font-size="11.5">web-v2 · Next.js dashboard</text>

  <rect x="34" y="94" width="228" height="48" rx="7" fill="#ffffff" stroke="#8250df" stroke-opacity=".5"/>
  <text x="52" y="116" fill="#8250df" font-size="13" font-weight="700">MCP client</text>
  <text x="52" y="133" fill="#8c959f" font-size="11.5">desktop · third-party agent</text>

  <!-- ══ RUNNER BOX ══ -->
  <rect x="34" y="170" width="666" height="356" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-opacity=".45"/>
  <text x="54" y="196" fill="#1a7f37" font-size="14.5" font-weight="700">runner box</text>
  <text x="162" y="196" fill="#8c959f" font-size="11.5">your machine — Claude credentials live only here</text>

  <rect x="54" y="210" width="626" height="54" rx="7" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="72" y="232" fill="#1f2328" font-size="13" font-weight="700">forge-runner</text>
  <text x="166" y="232" fill="#8c959f" font-size="11.5">Rust daemon · pairs as a device · gives a place to work</text>
  <text x="72" y="252" fill="#8c959f" font-size="11.5">installs the plugin this project designates, and the session hooks</text>

  <rect x="54" y="274" width="626" height="54" rx="7" fill="#ffffff" stroke="#1a7f37" stroke-opacity=".4"/>
  <text x="72" y="296" fill="#1a7f37" font-size="13" font-weight="700">master session</text>
  <text x="182" y="296" fill="#8c959f" font-size="11.5">one per project · decides order and batch size</text>
  <text x="72" y="316" fill="#8c959f" font-size="11.5">parented by tmux, so it outlives a daemon restart</text>

  <rect x="54" y="338" width="626" height="172" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-opacity=".45"/>
  <text x="74" y="362" fill="#bc4c00" font-size="13.5" font-weight="700">run session</text>
  <text x="182" y="362" fill="#8c959f" font-size="11.5">claude in a git worktree · one job, one skill</text>

  <rect x="74" y="374" width="176" height="52" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="92" y="395" fill="#bc4c00" font-size="12.5" font-weight="700">SKILL</text>
  <text x="92" y="414" fill="#59636e" font-size="11.5">issue-flow, end to end</text>

  <rect x="74" y="434" width="176" height="52" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="92" y="455" fill="#bc4c00" font-size="12.5" font-weight="700">HOOKS</text>
  <text x="92" y="474" fill="#59636e" font-size="11.5">gates on the agent</text>

  <rect x="286" y="374" width="196" height="112" rx="7" fill="#f6f8fa" stroke="#bc4c00" stroke-opacity=".5"/>
  <text x="304" y="395" fill="#bc4c00" font-size="12.5" font-weight="700">CLI</text>
  <text x="344" y="395" fill="#8c959f" font-size="11.5">bin/forge</text>
  <text x="304" y="416" fill="#59636e" font-size="11.5">next · claim · advance</text>
  <text x="304" y="434" fill="#59636e" font-size="11.5">issue · comment · record</text>
  <text x="304" y="452" fill="#59636e" font-size="11.5">guide · spec · doctor</text>
  <text x="304" y="474" fill="#8c959f" font-size="11">its own PAT, not the box's</text>

  <rect x="498" y="374" width="162" height="112" rx="7" fill="#ffffff" stroke="#bc4c00" stroke-opacity=".5" stroke-dasharray="4 3"/>
  <text x="516" y="395" fill="#bc4c00" font-size="12.5" font-weight="700">a second repo</text>
  <text x="516" y="418" fill="#59636e" font-size="11">SidCorp-co/</text>
  <text x="516" y="434" fill="#59636e" font-size="11">forge-plugin</text>
  <text x="516" y="456" fill="#8c959f" font-size="11">ships on its own</text>
  <text x="516" y="472" fill="#8c959f" font-size="11">clock — nothing</text>
  <text x="516" y="488" fill="#8c959f" font-size="11">here gates it</text>

  <text x="74" y="504" fill="#8c959f" font-size="11.5">The skill sequences its own phases. Core is told the result, never the order.</text>

  <!-- ══ WIRES ══ -->
  <path d="M262,58 L500,58 L500,112 L754,112" stroke="#8250df" stroke-width="1.6" fill="none" marker-end="url(#a1)"/>
  <text x="508" y="52" fill="#8250df" font-size="11">REST + WS · user JWT</text>

  <path d="M262,118 L560,118 L560,166 L754,166" stroke="#8250df" stroke-width="1.6" fill="none" marker-end="url(#a1)"/>
  <text x="568" y="146" fill="#8250df" font-size="11">MCP · session or PAT</text>

  <path d="M680,236 L722,236 L722,220 L754,220" stroke="#1a7f37" stroke-width="1.8" fill="none" marker-end="url(#a2)"/>
  <text x="474" y="196" fill="#1a7f37" font-size="11" font-weight="700">the box DIALS core · device token</text>

  <path d="M384,486 L384,518 L740,518 L740,126 L754,126" stroke="#bc4c00" stroke-width="1.8" fill="none" marker-end="url(#a3)"/>
  <text x="398" y="514" fill="#bc4c00" font-size="11" font-weight="700">REST · Bearer PAT</text>

  <path d="M360,264 L360,272" stroke="#1a7f37" stroke-width="1.4" fill="none" marker-end="url(#a2)"/>
  <path d="M360,328 L360,336" stroke="#1a7f37" stroke-width="1.4" fill="none" marker-end="url(#a2)"/>
  <text x="372" y="336" fill="#8c959f" font-size="11">opens</text>
</svg>
