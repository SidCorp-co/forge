<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="p1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker>
    <marker id="p2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="p4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>

  <rect x="0" y="0" width="1120" height="720" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1119" height="719" rx="14" fill="none" stroke="#d1d9e0"/>

  <text x="34" y="36" fill="#1f2328" font-size="15" font-weight="700">forge-plugin ⇄ forge — two repositories, three callers, one contract</text>
  <text x="34" y="55" fill="#8c959f" font-size="11.5">measured on main and on the plugin checkout, 2026-09-20</text>

  <!-- ══ PLUGIN REPO ══ -->
  <rect x="34" y="74" width="410" height="356" rx="10" fill="#faf7ff" stroke="#8250df" stroke-opacity=".45"/>
  <text x="54" y="100" fill="#8250df" font-size="14.5" font-weight="700">SidCorp-co/forge-plugin</text>
  <text x="54" y="119" fill="#8c959f" font-size="11.5">separate repo · ships on a plugin push</text>

  <rect x="54" y="134" width="370" height="52" rx="7" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="72" y="156" fill="#1f2328" font-size="13" font-weight="700">SKILL</text>
  <text x="134" y="156" fill="#59636e" font-size="12.5">plugin/skills/issue-flow</text>
  <text x="72" y="174" fill="#8c959f" font-size="11.5">the method — how an issue becomes shipped code</text>

  <rect x="54" y="196" width="370" height="86" rx="7" fill="#ffffff" stroke="#8250df" stroke-opacity=".6"/>
  <text x="72" y="218" fill="#1f2328" font-size="13" font-weight="700">CLI</text>
  <text x="134" y="218" fill="#59636e" font-size="12.5">plugin/bin/forge</text>
  <text x="72" y="238" fill="#8c959f" font-size="11.5">its OWN http client — plugin/src/tracker/rest.mjs</text>
  <text x="72" y="256" fill="#8c959f" font-size="11.5">not forge-runner · Bearer PAT from `forge doctor`</text>
  <text x="72" y="274" fill="#8250df" font-size="11.5">36 capabilities in 9 families, declared in routes.mjs</text>

  <rect x="54" y="292" width="370" height="52" rx="7" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="72" y="314" fill="#1f2328" font-size="13" font-weight="700">HOOKS</text>
  <text x="134" y="314" fill="#59636e" font-size="12.5">session gates</text>
  <text x="72" y="332" fill="#8c959f" font-size="11.5">fire inside the agent's own session</text>

  <rect x="54" y="354" width="370" height="56" rx="7" fill="#fff8f0" stroke="#bc4c00" stroke-opacity=".5"/>
  <text x="72" y="376" fill="#bc4c00" font-size="12" font-weight="700">owns HOW</text>
  <text x="72" y="394" fill="#8c959f" font-size="11.5">method · phase meaning · verbs.</text>
  <text x="72" y="410" fill="#8c959f" font-size="11.5">Never core's status set.</text>

  <!-- ══ CORE ══ -->
  <rect x="676" y="74" width="410" height="356" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-opacity=".45"/>
  <text x="696" y="100" fill="#0969da" font-size="14.5" font-weight="700">forge · control plane</text>
  <text x="696" y="119" fill="#8c959f" font-size="11.5">packages/core — ships on a core deploy</text>

  <rect x="696" y="134" width="370" height="52" rx="7" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="714" y="156" fill="#1f2328" font-size="13" font-weight="700">MCP</text>
  <text x="772" y="156" fill="#59636e" font-size="12.5">/mcp</text>
  <text x="836" y="156" fill="#8c959f" font-size="12.5">37 tools</text>
  <text x="714" y="174" fill="#8c959f" font-size="11.5">holds no DB handle — true, guarded by nothing</text>

  <rect x="696" y="196" width="370" height="52" rx="7" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="714" y="218" fill="#1f2328" font-size="13" font-weight="700">REST</text>
  <text x="772" y="218" fill="#59636e" font-size="12.5">/api/*</text>
  <text x="836" y="218" fill="#8c959f" font-size="12.5">130 mounts</text>
  <text x="714" y="236" fill="#8c959f" font-size="11.5">the wide plane · the destination's single surface</text>

  <rect x="696" y="258" width="370" height="52" rx="7" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="714" y="280" fill="#1f2328" font-size="13" font-weight="700">DEVICE</text>
  <text x="780" y="280" fill="#59636e" font-size="12.5">/api/devices/me/*</text>
  <text x="946" y="280" fill="#8c959f" font-size="12.5">23</text>
  <text x="714" y="298" fill="#8c959f" font-size="11.5">pool · lease · phases · plugins · skills</text>

  <rect x="696" y="322" width="370" height="56" rx="7" fill="#f0fbf3" stroke="#1a7f37" stroke-opacity=".5"/>
  <text x="714" y="344" fill="#1a7f37" font-size="12" font-weight="700">owns WHAT IS TRUE</text>
  <text x="714" y="362" fill="#8c959f" font-size="11.5">state · evidence · admission · policy version.</text>
  <text x="714" y="378" fill="#8c959f" font-size="11.5">Refuses by name.</text>

  <!-- ══ THREE CALLERS ══ -->
  <rect x="464" y="74" width="192" height="356" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="482" y="100" fill="#1f2328" font-size="12.5" font-weight="700">three callers</text>
  <text x="482" y="117" fill="#8c959f" font-size="10.5">three credentials — why a</text>
  <text x="482" y="131" fill="#8c959f" font-size="10.5">wrong tool is reachable</text>

  <rect x="478" y="144" width="164" height="76" rx="7" fill="#faf7ff" stroke="#8250df" stroke-opacity=".5"/>
  <text x="492" y="164" fill="#8250df" font-size="11.5" font-weight="700">agent session</text>
  <text x="492" y="181" fill="#8c959f" font-size="10.5">claude, plugin installed</text>
  <text x="492" y="198" fill="#59636e" font-size="10.5">MCP tool call</text>
  <text x="492" y="213" fill="#8c959f" font-size="10.5">session or PAT</text>

  <rect x="478" y="230" width="164" height="76" rx="7" fill="#faf7ff" stroke="#8250df" stroke-opacity=".5"/>
  <text x="492" y="250" fill="#8250df" font-size="11.5" font-weight="700">`forge` CLI</text>
  <text x="492" y="267" fill="#8c959f" font-size="10.5">the SAME agent, shell</text>
  <text x="492" y="284" fill="#59636e" font-size="10.5">REST · Bearer PAT</text>
  <text x="492" y="299" fill="#8c959f" font-size="10.5">its own route table</text>

  <rect x="478" y="316" width="164" height="76" rx="7" fill="#f0fbf3" stroke="#1a7f37" stroke-opacity=".5"/>
  <text x="492" y="336" fill="#1a7f37" font-size="11.5" font-weight="700">forge-runner</text>
  <text x="492" y="353" fill="#8c959f" font-size="10.5">Rust daemon, your box</text>
  <text x="492" y="370" fill="#59636e" font-size="10.5">device API</text>
  <text x="492" y="385" fill="#8c959f" font-size="10.5">device token</text>

  <path d="M428 176 L474 178" stroke="#8250df" stroke-width="1.6" marker-end="url(#p1)"/>
  <path d="M428 250 L474 258" stroke="#8250df" stroke-width="1.6" marker-end="url(#p1)"/>
  <path d="M646 178 L692 162" stroke="#8250df" stroke-width="1.6" marker-end="url(#p1)"/>
  <path d="M646 258 L692 224" stroke="#8250df" stroke-width="1.6" marker-end="url(#p1)"/>
  <path d="M646 350 L692 290" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#p2)"/>

  <!-- ══ DEFECT 1 — NAME COLLISION ══ -->
  <rect x="34" y="446" width="1052" height="98" rx="10" fill="#fff5f5" stroke="#cf222e" stroke-opacity=".5"/>
  <text x="54" y="471" fill="#cf222e" font-size="13" font-weight="700">the agent has two routes to the same data, under the same name</text>
  <text x="54" y="492" fill="#8c959f" font-size="11.5">All 9 CLI capability families carry the identical name as a core MCP tool. There are no CLI-only names, and nothing says which is authoritative.</text>

  <rect x="54" y="502" width="480" height="30" rx="6" fill="#ffffff" stroke="#8250df" stroke-opacity=".4"/>
  <text x="68" y="522" fill="#8250df" font-size="11">CLI → REST&#160;&#160;&#160;forge_issues · forge_projects · forge_knowledge · forge_config</text>

  <rect x="546" y="502" width="520" height="30" rx="6" fill="#ffffff" stroke="#0969da" stroke-opacity=".4"/>
  <text x="560" y="522" fill="#0969da" font-size="11">MCP → /mcp&#160;&#160;&#160;forge_project_pm · forge_comments · forge_guide · forge_memory · forge_uploads</text>

  <!-- ══ DEFECT 2 — THE PIN ══ -->
  <rect x="34" y="558" width="1052" height="140" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="54" y="583" fill="#1f2328" font-size="13" font-weight="700">five contract items · one carries a version · and it is dropped in the one case it is load-bearing</text>

  <rect x="54" y="596" width="150" height="40" rx="6" fill="#fff5f5" stroke="#cf222e" stroke-opacity=".35"/>
  <text x="66" y="613" fill="#1f2328" font-size="10.5" font-weight="700">skill name</text>
  <text x="66" y="628" fill="#8c959f" font-size="10">a literal in core</text>

  <rect x="212" y="596" width="150" height="40" rx="6" fill="#fff5f5" stroke="#cf222e" stroke-opacity=".35"/>
  <text x="224" y="613" fill="#1f2328" font-size="10.5" font-weight="700">5 driver statuses</text>
  <text x="224" y="628" fill="#8c959f" font-size="10">no version</text>

  <rect x="370" y="596" width="150" height="40" rx="6" fill="#fff5f5" stroke="#cf222e" stroke-opacity=".35"/>
  <text x="382" y="613" fill="#1f2328" font-size="10.5" font-weight="700">3 phase endpoints</text>
  <text x="382" y="628" fill="#8c959f" font-size="10">no version</text>

  <rect x="528" y="596" width="196" height="40" rx="6" fill="#fff5f5" stroke="#cf222e" stroke-opacity=".35"/>
  <text x="540" y="613" fill="#1f2328" font-size="10.5" font-weight="700">the data surface</text>
  <text x="540" y="628" fill="#8c959f" font-size="10">declared plugin-side only, never compared</text>

  <rect x="732" y="596" width="150" height="40" rx="6" fill="#f0fbf3" stroke="#1a7f37" stroke-opacity=".6"/>
  <text x="744" y="613" fill="#1a7f37" font-size="10.5" font-weight="700">pinnedRef ✓</text>
  <text x="744" y="628" fill="#8c959f" font-size="10">a commit SHA</text>

  <path d="M886 616 L916 616" stroke="#cf222e" stroke-width="1.5" marker-end="url(#p4)"/>
  <rect x="922" y="596" width="144" height="40" rx="6" fill="#fff5f5" stroke="#cf222e" stroke-opacity=".6"/>
  <text x="934" y="613" fill="#cf222e" font-size="10.5" font-weight="700">nulled on conflict</text>
  <text x="934" y="628" fill="#8c959f" font-size="10">box then runs HEAD</text>

  <rect x="54" y="648" width="1012" height="36" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="68" y="663" fill="#8c959f" font-size="10.5">pinnedRef is designated per PROJECT and installed per DEVICE. Two projects naming different SHAs merge to null — the SHAs move to a side field, the</text>
  <text x="68" y="677" fill="#8c959f" font-size="10.5">daemon logs a warning and installs plugin HEAD. A stated disagreement becomes an unstated one, in the only situation where the pin was doing work.</text>
</svg>
