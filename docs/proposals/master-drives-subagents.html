<!doctype html>

<style>
:root{--bg:#0f1115;--panel:#161a21;--line:#2a3038;--fg:#e6e9ee;--dim:#98a2b3;

svg{display:block;margin:0 auto;max-width:100%;height:auto}
.lg{display:flex;gap:1.3rem;flex-wrap:wrap;margin:1rem 0 0;

.lg i{font-style:normal}
