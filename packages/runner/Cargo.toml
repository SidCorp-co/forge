[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.18.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
dirs-next = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
which = "8"
rusqlite = { version = "0.40", features = ["bundled"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
# Reads a printed usage-limit reset in its named zone: the system tzdb on unix,
# a bundled one on Windows, where there is none.
jiff = "0.2"
# ISS-305 — open the browser to the /pair approval URL during `forge-runner login`.
webbrowser = "1"

[workspace.lints.clippy]
too_many_lines = "warn"

# Lightweight release: single small static-ish binary.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
