[package]
name = "forge-runner-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
dirs-next = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = { workspace = true }
uuid = { workspace = true }
hostname = { workspace = true }
which = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rusqlite = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "fs"] }

# Keychain only on macOS/Windows — Linux uses the file store to avoid pulling
# libdbus-sys (system dbus-1) via secret-service, keeping the binary portable.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Only the tests need a subscriber: the library emits tracing events and says nothing about where
# they go, but ISS-1050 criterion 18 is a claim about what the daemon LOG says, and a claim about a
# log that nothing reads back is carried by the code's good intentions rather than by a check.
tracing-subscriber = { workspace = true }
