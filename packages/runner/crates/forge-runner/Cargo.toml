[package]
name = "forge-runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "forge-runner"
path = "src/main.rs"

[dependencies]
forge-runner-core = { path = "../forge-runner-core" }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
which = { workspace = true }
dirs-next = { workspace = true }
webbrowser = { workspace = true }
# ISS-1341 — `top` reads the ledger opened read-only, which `Ledger::open` cannot do.
rusqlite = { workspace = true }

# ISS-1341 — `top` reads the terminal's size (TIOCGWINSZ) to fit its live frame.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
forge-runner-core = { path = "../forge-runner-core", features = ["test-support"] }
