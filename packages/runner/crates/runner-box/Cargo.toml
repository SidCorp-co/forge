[package]
name = "runner-box"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
runner-platform = { path = "../runner-platform" }
runner-preview = { path = "../runner-preview" }
runner-transport = { path = "../runner-transport" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
dirs-next = { workspace = true }
jiff = { workspace = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# the attach proxy's discovery reads (ISS-1322)
reqwest = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "fs", "feature", "user"] }

[lints]
workspace = true
