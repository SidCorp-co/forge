[package]
name = "runner-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
runner-platform = { path = "../runner-platform" }
runner-update = { path = "../runner-update" }
runner-transport = { path = "../runner-transport" }
runner-core = { path = "../runner-core" }
runner-proto = { path = "../runner-proto" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
dirs-next = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
hostname = { workspace = true }
which = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "fs"] }

[target.'cfg(target_os = "windows")'.dependencies]
# `LockFileEx` over one byte past a file's end, which `std::fs::File::lock` cannot express.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[lints]
workspace = true
